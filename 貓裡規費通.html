<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貓裡規費通</title>
<style>
/* 一樓收件櫃台用：按申請原因 → 填幾個數字 → 看大大的金額 → 列印明細 */
:root {
  --bg: #eef2f1; --card: #ffffff; --card2: #f5f8f7; --ink: #1c2a33; --muted: #5a6a73; --line: #d6dfdd;
  --fill: #fff6cf; --fill-ink: #1c2a33; --on-accent: #ffffff; --shadow: 0 1px 2px rgba(20,40,50,.06), 0 6px 20px -12px rgba(20,40,50,.25);
  --land: #2f7d4f; --land-soft: #e3f2e8; --bld: #1f5f8b; --bld-soft: #e1edf6; --court: #8a4b12; --court-soft: #f8ead9;
  --ask: #b3302a; --ask-soft: #fbeceb; --money: #b3302a; --accent: #1f5f8b; --reg: #6b3fa0; --reg-soft: #f1eaf8;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --num: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171b; --card: #1a2228; --card2: #20292f; --ink: #e3e9ed; --muted: #97a6b0; --line: #2f3c45;
    --land: #6cc690; --land-soft: #1b3326; --bld: #72b4d4; --bld-soft: #1a3140; --court: #e2a35f; --court-soft: #382a1a;
    --ask: #ef7d72; --ask-soft: #3a2120; --money: #ff8f84; --accent: #72b4d4; --reg: #c3a3ee; --reg-soft: #2c2240; --fill: #fff1b8; --fill-ink: #1c2a33; --on-accent: #0e1a20; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171b; --card: #1a2228; --card2: #20292f; --ink: #e3e9ed; --muted: #97a6b0; --line: #2f3c45;
  --land: #6cc690; --land-soft: #1b3326; --bld: #72b4d4; --bld-soft: #1a3140; --court: #e2a35f; --court-soft: #382a1a;
  --ask: #ef7d72; --ask-soft: #3a2120; --money: #ff8f84; --accent: #72b4d4; --reg: #c3a3ee; --reg-soft: #2c2240; --fill: #fff1b8; --fill-ink: #1c2a33; --on-accent: #0e1a20; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.65 var(--font); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--bld-soft); }
button, input, textarea, select { font: inherit; color: inherit; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 20px 140px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); letter-spacing: .04em; }
.brand { display: flex; align-items: center; gap: 12px; }
.mascot { font-size: 44px; line-height: 1; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.slogan { margin: 2px 0 0; font-size: 16px; font-weight: 700; color: var(--money); letter-spacing: .06em; }
.slogan span { color: var(--muted); font-weight: 400; letter-spacing: 0; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 16px; min-height: 42px; cursor: pointer; white-space: nowrap; transition: border-color .15s, color .15s, background .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.big { padding: 12px 20px; font-size: 18px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { color: var(--on-accent); filter: brightness(1.1); }
.btn.law { font-size: 14px; padding: 4px 10px; border-color: var(--accent); color: var(--accent); background: transparent; }
.steps { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; padding: 0; list-style: none; font-size: 15px; color: var(--muted); }
.steps li { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px 4px 6px; }
.steps li b { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); margin-right: 6px; font-size: 14px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* ---- 第 1 步：申請原因大按鈕 ---- */
.pick { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
.pick h2 { margin: 0 0 10px; font-size: 19px; }
.grp { margin-top: 10px; }
.grp h3 { margin: 0 0 6px; font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: .1em; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.tile { border: 2px solid var(--line); background: var(--card2); border-radius: 12px; padding: 12px 8px; min-height: 66px; cursor: pointer; font-size: 17px; font-weight: 700; text-align: center; line-height: 1.3; position: relative; transition: border-color .15s, background .15s, transform .12s, box-shadow .15s, opacity .15s; }
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.tile small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.g-land .tile:hover, .g-land .tile[aria-pressed="true"] { border-color: var(--land); }
.g-land .tile[aria-pressed="true"] { background: var(--land-soft); }
.g-bld .tile:hover, .g-bld .tile[aria-pressed="true"] { border-color: var(--bld); }
.g-bld .tile[aria-pressed="true"] { background: var(--bld-soft); }
.g-court .tile:hover, .g-court .tile[aria-pressed="true"] { border-color: var(--court); }
.g-court .tile[aria-pressed="true"] { background: var(--court-soft); }
.tile[aria-pressed="true"]::after { content: "✓"; position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: var(--ink); color: var(--card); }
.tile.q { border-style: dashed; }
.tile.q small { color: var(--ask); }

details.grp > summary { cursor: pointer; list-style: none; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary h3::before { content: "▸ "; }
details.grp[open] > summary h3::before { content: "▾ "; }
.g-old .tile[aria-pressed="true"] { border-color: var(--muted); background: var(--card2); }
.weblink { display: grid; gap: 2px; padding: 16px 18px; border-radius: 12px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-size: 20px; font-weight: 800; }
.weblink small { font: 400 13px var(--num); opacity: .85; word-break: break-all; }
.weblink:hover { filter: brightness(1.1); }
.linkbtn { justify-self: start; border: 0; background: transparent; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 2px 0; font-size: 15px; }
.linkbtn:hover { color: var(--accent); }
.ver { font: 400 13px var(--num); letter-spacing: 0; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; cursor: pointer; vertical-align: 2px; }
.ver:hover { color: var(--accent); border-color: var(--accent); }
.pv { background: #fff; color: #000; padding: 16px; border-radius: 8px; overflow-x: auto; }
.pv .rp { min-width: 560px; }
.pv h1 { font-size: 22px; text-align: center; letter-spacing: .2em; margin: 0 0 10px; }
.pv .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 20px; font-size: 14px; margin-bottom: 10px; }
.pv table { width: 100%; border-collapse: collapse; font-size: 14px; }
.pv th, .pv td { border: 1px solid #000; padding: 4px 6px; vertical-align: top; }
.pv th { background: #eee; }
.pv td.n { text-align: right; font-family: var(--num); white-space: nowrap; }
.pv .grp-row td { background: #f3f3f3; font-weight: 700; }
.pv .basis { font-size: 12px; color: #333; }
.pv .tot td { font-size: 17px; font-weight: 700; }
.pv .notes { font-size: 12px; margin-top: 8px; }
.pv .notes p { margin: 2px 0; }
.pv .sign { display: flex; justify-content: space-between; margin-top: 18px; font-size: 14px; }
.pv .brandline { margin-top: 10px; text-align: right; font-size: 11px; color: #666; }

.regbtn { margin-top: 14px; width: 100%; border: 2px dashed var(--reg); background: var(--reg-soft); color: var(--reg); border-radius: 12px; padding: 12px; font-size: 18px; font-weight: 800; cursor: pointer; }
.regbtn[aria-pressed="true"] { border-style: solid; }
.regbtn small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
.card.reg { --c: var(--reg); margin-top: 14px; }
.reg-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr) auto auto; gap: 8px 12px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--card2); }
.reg-row select, .reg-row input { min-width: 0; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--card); }
.reg-row input { font: 700 17px var(--num); background: var(--fill); color: var(--fill-ink); text-align: right; }
.reg-row .out { font: 700 15px var(--num); color: var(--money); white-space: nowrap; text-align: right; min-width: 6em; }
.reg-row .hint2 { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-top: -4px; }
@media (max-width: 640px) { .reg-row { grid-template-columns: minmax(0, 1fr) auto; } .reg-row select { grid-column: 1 / -1; } }
.sub-h { margin: 4px 0 0; font-size: 16px; }
.date-in { flex: 0 1 12em !important; font: 700 17px var(--num); background: var(--fill) !important; color: var(--fill-ink); }
.date-in.bad { border-color: var(--ask); box-shadow: 0 0 0 3px var(--ask-soft); }
.split { display: grid; gap: 4px; font-size: 15px; padding: 8px 10px; border-radius: 10px; background: var(--card2); }
.split div { display: flex; justify-content: space-between; gap: 10px; }
.split div span:last-child { font-family: var(--num); font-weight: 700; }
.split .r span { color: var(--reg); }
#btnCust[aria-pressed="true"] { border-color: var(--land); color: var(--land); background: var(--land-soft); }
.mini li.h { border: 0; font-weight: 700; color: var(--muted); font-size: 13px; letter-spacing: .1em; padding-top: 6px; }

.search { margin: 4px 0 6px; display: grid; gap: 8px; }
.search input { width: 100%; border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px; font-size: 19px; background: var(--card); }
.search input:focus { outline: none; box-shadow: 0 0 0 4px var(--bld-soft); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.qres { display: grid; gap: 6px; }
.qres button { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--card2); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.qres button:hover, .qres button.first { border-color: var(--accent); background: var(--bld-soft); }
.qres b { font-size: 18px; }
.qres span { font-size: 14px; color: var(--muted); }
.qres em { font-style: normal; font-size: 13px; color: var(--land); white-space: nowrap; }
.qres .none { color: var(--muted); font-size: 15px; padding: 6px 2px; }
.tile.dim { opacity: .3; }

/* ---- 第 2 步：填數字卡片 ---- */
.cards { display: grid; gap: 14px; }
.empty { border: 2px dashed var(--line); border-radius: 16px; padding: 32px 20px; text-align: center; color: var(--muted); background: var(--card2); font-size: 18px; }
.empty .monkey { font-size: 44px; display: block; margin-bottom: 6px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--card); padding: 12px 20px; border-radius: 999px; font-size: 16px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 980px) { .toast { bottom: 130px; } }
.card { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--c, var(--accent)); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); scroll-margin-top: 16px; }
.card.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 6px var(--c, var(--accent)); } 100% { box-shadow: var(--shadow); } }
@media (prefers-reduced-motion: reduce) { .card.flash { animation: none; } .tile, .btn { transition: none; } .tile:hover { transform: none; } }
.card.land { --c: var(--land); } .card.bld { --c: var(--bld); } .card.court { --c: var(--court); } .card.ask { --c: var(--ask); }
.card-h { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--card2); border-bottom: 1px solid var(--line); }
.card-h h2 { margin: 0; font-size: 21px; }
.card-h .sub { margin-left: auto; font: 700 20px var(--num); color: var(--money); }
.card-h .x { border: 0; background: transparent; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0 4px; }
.card-h .x:hover { color: var(--ask); }
.card-b { padding: 14px 16px 16px; display: grid; gap: 14px; }
.say { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--card2); font-size: 15px; }
.say b { color: var(--money); }
.warn { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--ask-soft); color: var(--ask); font-size: 15px; }
.q-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.q-row > .lbl { min-width: 10em; font-weight: 600; }
.q-row .note { flex-basis: 100%; font-size: 13.5px; color: var(--muted); margin-top: -6px; }
.stepper { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { width: 44px; border: 0; background: var(--card2); font-size: 22px; cursor: pointer; }
.stepper button:hover { color: var(--accent); }
.stepper input { width: 72px; border: 0; text-align: center; font: 700 20px var(--num); background: var(--fill); color: var(--fill-ink); padding: 6px 0; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.unit { color: var(--muted); font-size: 15px; }
.area-list { display: grid; gap: 8px; }
.area-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--card2); }
.area-row .no { font-weight: 700; min-width: 4.5em; }
.area-row input { width: 9em; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: 700 18px var(--num); background: var(--fill); color: var(--fill-ink); text-align: right; }
.area-row .tier { font-size: 14px; color: var(--muted); }
.area-row .tier b { color: var(--ink); }
.area-row .del { margin-left: auto; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 20px; }
.area-row .del:hover { color: var(--ask); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--c, var(--accent)); background: var(--card2); }
.opt input { width: 20px; height: 20px; margin-top: 3px; }
.opt b { font-size: 16px; }
.opt span { grid-column: 2; font-size: 13.5px; color: var(--muted); }
input.money-in.bad { border-color: var(--ask); box-shadow: 0 0 0 3px var(--ask-soft); }
input.money-in { width: 10em; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: 700 20px var(--num); background: var(--fill); color: var(--fill-ink); text-align: right; }
input.text-in { flex: 1 1 260px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--card); }

/* ---- 第 3 步：應收合計 ---- */
.total { position: sticky; top: 16px; background: var(--card); border: 2px solid var(--money); border-radius: 18px; padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.total .flow { margin: 0; font-size: 13px; color: var(--muted); }
.total h2 { margin: 0; font-size: 18px; }
.big-money { font: 800 clamp(40px, 6vw, 56px)/1 var(--num); color: var(--money); letter-spacing: -.02em; }
.big-money small { font-size: 22px; margin-right: 4px; }
.cn-money { font-size: 15px; color: var(--muted); margin-top: -4px; }
.mini { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 15px; max-height: 40vh; overflow: auto; }
.mini li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--line); padding: 3px 0; }
.mini li span:last-child { font-family: var(--num); white-space: nowrap; }
.mini li.flag span:first-child { color: var(--ask); }
.case-in { display: grid; gap: 6px; font-size: 14px; }
.case-in label { display: flex; gap: 8px; align-items: center; }
.case-in input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--card2); }
.total .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.foot { margin-top: 18px; font-size: 13px; color: var(--muted); }
@media (max-width: 980px) {
  .total .flow { display: none; }
  .total { position: fixed; left: 0; right: 0; bottom: 0; top: auto; border-radius: 16px 16px 0 0; border-width: 2px 0 0; z-index: 20; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 6px; box-shadow: 0 -10px 30px -10px rgba(0,0,0,.35); }
  .total h2, .total .mini, .total .case-in, .total .cn-money, .total .split { display: none; }
  .total .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .big-money { font-size: 36px; }
}

/* ---- 依據對話框 ---- */
dialog { width: min(760px, calc(100vw - 24px)); max-height: 86vh; border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.5); }
.dlg-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); }
.dlg-h h2 { margin: 0; font-size: 19px; }
.dlg-b { padding: 14px 18px 20px; display: grid; gap: 14px; font-size: 15.5px; }
.law { border-left: 4px solid var(--accent); padding: 4px 0 4px 12px; }
.law h3 { margin: 0 0 4px; font-size: 16px; color: var(--accent); }
.law p { margin: 0 0 4px; }
.law .src { font-size: 13px; color: var(--muted); }
.law.inhouse { border-color: var(--court); }
.law.inhouse h3 { color: var(--court); }
table.t { border-collapse: collapse; width: 100%; font-size: 14.5px; }
table.t th, table.t td { border: 1px solid var(--line); padding: 5px 8px; text-align: center; }
table.t td:first-child { text-align: left; }
.tscroll { overflow-x: auto; }

/* ---- 列印 ---- */
#printArea { display: none; }
@media print {
  @page { size: A4; margin: 14mm 14mm; }
  body { background: #fff; color: #000; font-size: 12pt; }
  .wrap, dialog { display: none !important; }
  #printArea { display: block; }
  .rp h1 { font-size: 20pt; text-align: center; margin: 0 0 4mm; letter-spacing: .2em; }
  .rp .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 1mm 8mm; font-size: 11pt; margin-bottom: 4mm; }
  .rp table { width: 100%; border-collapse: collapse; font-size: 11pt; }
  .rp th, .rp td { border: 1px solid #000; padding: 1.6mm 2mm; vertical-align: top; }
  .rp th { background: #eee; }
  .rp td.n { text-align: right; font-family: var(--num); white-space: nowrap; }
  .rp .grp-row td { background: #f3f3f3; font-weight: 700; }
  .rp .basis { font-size: 9.5pt; color: #333; }
  .rp .tot td { font-size: 14pt; font-weight: 700; }
  .rp .notes { font-size: 9.5pt; margin-top: 4mm; }
  .rp .sign { display: flex; justify-content: space-between; margin-top: 10mm; font-size: 11pt; }
  .rp .brandline { margin-top: 6mm; text-align: right; font-size: 8.5pt; color: #666; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mascot" aria-hidden="true">🐒</span>
      <div>

/* =====================================================================
   計算：每張卡片回傳明細列 [{t:項目, f:算式, a:金額, law:[依據]}]
   ===================================================================== */

function lotLines(lots, table, label) {
  const out = [];
  lots.forEach((v, i) => {
    const a = parseFloat(v);
    if (!(a > 0)) return;
    const t = tierOf(a);
    out.push({ t: `${label}（第 ${i + 1} 筆，${fmt(a)} ㎡，${RATES.tierNames[t]}）`, f: `${fmt(table[t])} × 1 筆`, a: table[t] });
  });
  return out;
}
function floorLines(floors, rate, label) {
  const out = []; let u = 0;
  floors.forEach(v => { u += units50(parseFloat(v) || 0); });
  if (u) out.push({ t: label, f: `${fmt(rate)} × ${u} 單位（每 50 ㎡ 一單位）`, a: rate * u });
  return out;
}

function calc(it) {
  const s = state[it.id];
  const L = [];
  if (it.web && s.web) {
    const a = Math.round(parseFloat(s.amt));
    L.push({ t: `${it.name}（依內政部試算網站計算）`, f: a > 0 ? "網站試算結果" : "尚未填網站金額", a: a > 0 ? a : 0, law: ["web"], flag: !(a > 0) });
    return L;
  }
  switch (it.kind) {
    case "jianjie": {
      lotLines(s.lots, RATES.jianjieBase, "鑑界基本費").forEach(x => L.push({ ...x, law: ["t1_1"] }));
      const u = Math.ceil((s.points || 0) / 5);
      if (u > 0) L.push({ t: `鑑界施測費（全案 ${s.points} 點，每 5 點一單位）`, f: `${fmt(RATES.jianjieUnit)} × ${u} 單位`, a: RATES.jianjieUnit * u, law: ["t1_1", "inJianjie"] });
      break;
    }
    case "zheng": {
      const m2 = parseFloat(s.area);
      if (!(m2 > 0)) break;
      const ha = m2 / 10000, haC = Math.max(1, ha);
      const a4 = ha <= 1 ? RATES.zhengHa : Math.round(ha * RATES.zhengHa / 100) * 100;
      L.push({ t: `作業費（面積 ${fmt(m2)} ㎡ ＝ ${ha.toFixed(4)} 公頃${ha < 1 ? "，不足 1 公頃以 1 公頃計" : ""}）`, f: ha <= 1 ? `${fmt(RATES.zhengHa)} × 1 公頃` : `${fmt(RATES.zhengHa)} × ${ha.toFixed(4)} 公頃，四捨五入至百元`, a: a4, law: ["z4"] });
      const incLots = Math.ceil(haC) * RATES.zhengLotsPerHa; // 不足 1 公頃以 1 公頃計：1.5 公頃算 2 公頃 → 40 筆
      const exL = Math.max(0, (s.nLots || 0) - incLots);
      if (exL) L.push({ t: `筆數加計（共 ${s.nLots} 筆，已含 ${incLots} 筆）`, f: `${fmt(RATES.zhengLot)} × ${exL} 筆`, a: RATES.zhengLot * exL, law: ["z5"] });
      const exP = Math.max(0, (s.people || 0) - RATES.zhengPeople);
      if (exP) L.push({ t: `人數加計（共 ${s.people} 人，已含 ${RATES.zhengPeople} 人）`, f: `${fmt(RATES.zhengPerson)} × ${exP} 人`, a: RATES.zhengPerson * exP, law: ["z5"] });
      break;
    }
    case "boss": {
      const a = Math.round(parseFloat(s.amt));
      L.push({ t: `${it.name}（課長決定${s.memo ? "：" + s.memo : ""}）`, f: a > 0 ? "依課長指示" : "尚未洽課長", a: a > 0 ? a : 0, law: ["inBoss"], flag: !(a > 0) && !s.memo });
      break;
    }
    case "landuse": L.push({ t: "地目變更", f: fmt(RATES.landUse), a: RATES.landUse, law: ["inLandUse"] }); break;
    case "lines": {
      const k = it.law[0];
      lotLines(s.lots, RATES.splitBase, "基本費").forEach(x => L.push({ ...x, law: [k] }));
      if (s.lines > 0) L.push({ t: "施測費（線段）", f: `${fmt(RATES.line)} × ${s.lines} 條線`, a: RATES.line * s.lines, law: [k, "inSplit"] });
      if (it.pts && s.pts > 0) L.push({ t: "確定界址點（未埋界標）", f: `${fmt(RATES.point)} × ${s.pts} 點`, a: RATES.point * s.pts, law: ["t1_n"] });
      if (it.half && s.half) { const sub = L.reduce((x, y) => x + y.a, 0); const h = Math.ceil(sub / 2); L.push({ t: "判決／調處確定，免實地測量：半數計收", f: `−(${fmt(sub)} ÷ 2)`, a: -(sub - h), law: ["s6"] }); }
      break;
    }
    case "adjust": {
      const a = parseFloat(s.area);
      if (a > 0) { const t = tierOf(a); L.push({ t: `界址調整基本費（調整地號面積總和 ${fmt(a)} ㎡，${RATES.tierNames[t]}）`, f: `${fmt(RATES.splitBase[t])}（只收一次）`, a: RATES.splitBase[t], law: ["t1_5"] }); }
      if (s.lines > 0) L.push({ t: "施測費（線段）", f: `${fmt(RATES.line)} × ${s.lines} 條線`, a: RATES.line * s.lines, law: ["t1_5", "inSplit"] });
      if (s.pts > 0) L.push({ t: "確定界址點（未埋界標）", f: `${fmt(RATES.point)} × ${s.pts} 點`, a: RATES.point * s.pts, law: ["t1_n"] });
      break;
    }
    case "other": {
      lotLines(s.lots, RATES.splitBase, "他項權利位置複丈基本費").forEach(x => L.push({ ...x, law: ["t1_9"] }));
      if (s.lines > 0) L.push({ t: "施測費（線段）", f: `${fmt(RATES.line)} × ${s.lines} 條線`, a: RATES.line * s.lines, law: ["t1_9", "inSplit"] });
      break;
    }
    case "free": L.push({ t: `${it.name}：免費`, f: "0", a: 0, law: it.law }); break;
    case "per500": if (s.n > 0) L.push({ t: `${it.name}費`, f: `${fmt(RATES.survey500)} × ${s.n} ${it.unitWord || "建號"}`, a: RATES.survey500 * s.n, law: it.law }); break;
    case "bfirst": {
      if (s.mode === "282") {
        const up = it.id === "extend" && s.dir !== "side";
        const full = up ? 0 : Math.max(0, s.buildings);
        if (up) L.push({ t: "增建往上蓋（頂樓加蓋、加一層）：不收位置圖測量費", f: "0", a: 0, law: ["t2_1", "inExtend"] });
        if (full) L.push({ t: "建物位置圖測量費", f: `${fmt(RATES.bldPos)} × ${full} 棟`, a: RATES.bldPos * full, law: ["t2_1"] });
        if (s.sameBld > 0) L.push({ t: "同棟已測過，調原位置圖轉繪", f: `${fmt(RATES.bldPosSame)} × ${s.sameBld} 建號`, a: RATES.bldPosSame * s.sameBld, law: ["t2_1"] });
        floorLines(s.floors, RATES.bldFloor, "建物平面圖測量費").forEach(x => L.push({ ...x, law: ["t2_1"] }));
      } else if (s.mode === "2821") {
        L.push({ t: "建物位置圖轉繪費", f: `${fmt(RATES.bldRedrawPos)} × ${s.n} 建號`, a: RATES.bldRedrawPos * s.n, law: ["t2_2"] });
        L.push({ t: "建物平面圖轉繪費", f: `${fmt(RATES.bldRedrawFloor)} × ${s.n} 建號`, a: RATES.bldRedrawFloor * s.n, law: ["t2_2"] });
        if (!s.hasData) L.push({ t: "沒附建物測繪資料：加收位置圖測量費", f: `${fmt(RATES.bldPos)} × ${s.buildings} 棟`, a: RATES.bldPos * s.buildings, law: ["t2_2"] });
      } else {
        L.push({ t: "建物測量成果圖核對費", f: `${fmt(RATES.bldCheck)} × ${s.n} 建號`, a: RATES.bldCheck * s.n, law: ["t2_3"] });
        if (!s.hasFile) L.push({ t: "沒附電子檔：數值化作業費", f: `${fmt(RATES.bldDigital)} × ${s.n} 建號`, a: RATES.bldDigital * s.n, law: ["t2_3"] });
        if (!s.hasData) L.push({ t: "沒附建物測繪資料：加收位置圖測量費", f: `${fmt(RATES.bldPos)} × ${s.buildings} 棟`, a: RATES.bldPos * s.buildings, law: ["t2_3"] });
      }
      break;
    }
    case "bsplit":
      floorLines(s.floors, RATES.bSplitUnit, "建物分割複丈費（分割後面積）").forEach(x => L.push({ ...x, law: ["t3_2"] }));
      if (s.n > 0) L.push({ t: "建物分割轉繪費", f: `${fmt(RATES.bSplitDraw)} × ${s.n} 建號（分割後）`, a: RATES.bSplitDraw * s.n, law: ["t3_2"] });
      break;
    case "bmerge":
      floorLines(s.floors, RATES.bMergeUnit, "建物合併複丈費（合併前面積）").forEach(x => L.push({ ...x, law: ["t3_1"] }));
      if (s.n > 0) L.push({ t: "建物合併轉繪費", f: `${fmt(RATES.bMergeDraw)} × ${s.n} 建號（合併前）`, a: RATES.bMergeDraw * s.n, law: ["t3_1"] });
      break;
    case "loss":
      if (s.mode === "all") { if (s.n > 0) L.push({ t: "建物全部滅失勘查費", f: `${fmt(RATES.survey500)} × ${s.n} 建號`, a: RATES.survey500 * s.n, law: ["t3_5"] }); }
      else {
        floorLines(s.floors, RATES.bLossUnit, "建物部分滅失測量費（存餘面積）").forEach(x => L.push({ ...x, law: ["t3_3"] }));
        if (s.n > 0) L.push({ t: "建物部分滅失轉繪費", f: `${fmt(RATES.bLossDraw)} × ${s.n} 建號`, a: RATES.bLossDraw * s.n, law: ["t3_3"] });
      }
      break;
    case "court": {
      if (s.criminal) { L.push({ t: "法院／檢察機關行使國家刑罰權囑託：免費", f: "0", a: 0, law: ["s5"] }); break; }
      if (s.type === "bld") L.push({ t: "法院預收：會勘、履勘等（沒有分割類字眼）", f: `${fmt(RATES.courtBld)}（一案一筆）`, a: RATES.courtBld, law: ["inCourt", "s4"] });
      else if (s.type === "split") lotLines(s.lots, RATES.splitBase, "法院預收：分割方案基本費").forEach(x => L.push({ ...x, law: ["inCourt", "s4", "t1_4"] }));
      else L.push({ t: "法院囑託：還沒選來文是哪一種", f: "請先選", a: 0, law: ["inCourt"], flag: true });
      if (s.double) { const sub = L.reduce((x, y) => x + y.a, 0); if (sub) L.push({ t: "限期 15 日內辦理：費用加倍", f: `+${fmt(sub)}`, a: sub, law: ["s4"] }); }
      const n = parseInt(s.maps);
      if (!(n >= 0) || s.maps === "") L.push({ t: "成果圖份數（必填，還沒填）", f: "請填份數", a: 0, law: ["inCourtMap"], flag: true });
      else L.push({ t: `成果圖 ${n} 份（第 1 份免費）`, f: n > 1 ? `${fmt(RATES.courtMap)} × ${n - 1} 份` : "免費", a: RATES.courtMap * Math.max(0, n - 1), law: ["inCourtMap", "s7"] });
      break;
    }
  }
  return L;
}

const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderTiles() {
  const box = document.getElementById("tileGroups");
  box.innerHTML = "";
  GROUPS.forEach(G => {
    const open = ITEMS.some(i => i.g === G.g && state[i.id]);
    const g = G.fold ? $(`<details class="grp g-${G.g}"${open ? " open" : ""}><summary><h3>${G.t}</h3></summary><div class="tiles"></div></details>`)
                     : $(`<div class="grp g-${G.g}"><h3>${G.t}</h3><div class="tiles"></div></div>`);

function lawKeys(it) {

function renderCards() {

function wire(c, it) {
  const s = state[it.id];
  const rer = () => { const y = window.scrollY; renderCards(); window.scrollTo(0, y); update(); };
  c.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
    const k = b.dataset.step, inp = c.querySelector(`input[data-k="${k}"]`);
    s[k] = Math.max(+inp.min || 0, (parseInt(s[k]) || 0) + +b.dataset.d); inp.value = s[k]; update();
  });
  c.querySelectorAll("input[data-k], textarea[data-k]").forEach(inp => inp.oninput = () => {

    s[k] = inp.type === "number" && inp.closest(".stepper") ? Math.max(+inp.min || 0, parseInt(inp.value) || 0) : inp.value;
    if (k === "maps") inp.classList.toggle("bad", inp.value === "");

  });
  c.querySelectorAll("input[data-li]").forEach(inp => inp.oninput = () => { s[inp.dataset.li][+inp.dataset.i] = inp.value; update(); });
  c.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { s[b.dataset.add].push(""); rer(); const l = c.ownerDocument.querySelectorAll(`#card-${it.id} [data-li="${b.dataset.add}"]`); l[l.length - 1]?.focus(); });
  c.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { s[b.dataset.del].splice(+b.dataset.i, 1); rer(); });
  c.querySelectorAll("input[type=radio]").forEach(r => { r.dataset.k = r.name; r.name = it.id + "__" + r.name; r.checked = s[r.dataset.k] === r.value; r.onchange = () => { s[r.dataset.k] = r.value; rer(); }; });

  c.querySelectorAll("input[data-ck]").forEach(r => r.onchange = () => { s[r.dataset.ck] = r.checked; rer(); });
}

function cnMoney(n) {
  if (!n) return "零";
  const d = "零壹貳參肆伍陸柒捌玖", u = ["", "拾", "佰", "仟"], big = ["", "萬", "億"];
  let s = "", i = 0, low = -1;
  while (n > 0) {
    const part = n % 10000; let p = "", zero = false;
    for (let j = 3; j >= 0; j--) { const x = Math.floor(part / 10 ** j) % 10; if (x) { if (zero) p += "零"; p += d[x] + u[j]; zero = false; } else if (p) zero = true; }
    if (p) s = p + big[i] + (s && (low < 1000 || part % 10 === 0) ? "零" : "") + s;
    if (part || !s) low = part; else low = 0;
    n = Math.floor(n / 10000); i++;
  }
  return s.replace(/零+$/, "");
}

  if (b) { b.setAttribute("aria-pressed", "true"); b.textContent = "🖥 民眾畫面已開（再按關閉）"; }
}
document.getElementById("btnCust").onclick = async () => {
  if (custWin && !custWin.closed) { custWin.close(); custWin = null; update(); return; }
  let feat = "width=1024,height=768";
  try {   // 有支援就自動放到第二個螢幕（瀏覽器會先問一次「視窗管理」權限）
    if ("getScreenDetails" in window) {
      const sd = await window.getScreenDetails();
      const other = sd.screens.find(x => x !== sd.currentScreen) || sd.screens.find(x => !x.isPrimary);
      if (other) feat = `left=${other.availLeft},top=${other.availTop},width=${other.availWidth},height=${other.availHeight}`;
    }
  } catch (e) {}
  custWin = window.open("", "maoliCustomer", feat);
  if (!custWin) { alert("瀏覽器擋住了彈出視窗，請允許這個網頁開新視窗。"); return; }
  custWin.document.open();
  custWin.document.write(`<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>本次應繳費用｜貓裡規費通</title><style>
    body{margin:0;background:#fff;color:#1d2730;font:26px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;min-height:100vh}
    header{padding:24px 40px 8px;border-bottom:3px solid #1f5f8b}h1{margin:0;font-size:46px;letter-spacing:.1em}.meta{font-size:22px;color:#5d6a74}
    main{flex:1;padding:12px 40px;overflow:auto}h2{font-size:30px;margin:18px 0 6px;color:#6b3fa0}
    table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px dotted #bbb;vertical-align:top}
    td.n{text-align:right;white-space:nowrap;font-family:Consolas,monospace;padding-left:24px}
    tr.g td{font-weight:800;border-bottom:2px solid #1d2730;padding-top:14px}tr:not(.g):not(.s) td:first-child{padding-left:28px;font-size:22px;color:#444}
    tr.s td{font-weight:800;border-top:2px solid #1d2730}
    footer{background:#fbeceb;padding:20px 40px 26px;border-top:4px solid #b3302a}.lbl{font-size:28px;font-weight:700}
    .big{font:800 88px/1.1 Consolas,monospace;color:#b3302a}.cn{font-size:30px;font-weight:700}footer p{margin:8px 0 0;font-size:20px;color:#5d6a74}footer p.brand{font-size:16px;text-align:right;margin-top:4px}
    </style></head><body><div id="cv" style="display:contents"></div></body></html>`);
  custWin.document.close();
  update();
};

/* ---- 列印 ---- */
document.getElementById("btnPrint").onclick = () => {
  if (!order.length && !reg) { toast("還沒選任何申請原因，先按上面的按鈕喔"); return; }
  const total = update(); const c = caseInfo(); const d = new Date();
  const ds = `${d.getFullYear() - 1911} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  let rows = "";
  allLines().forEach(({ it, lines }) => {
    const sub = lines.reduce((a, b) => a + b.a, 0);
    rows += `<tr class="grp-row"><td colspan="3">${esc(it.name)}</td><td class="n">${fmt(sub)}</td></tr>`;
    lines.forEach(l => rows += `<tr><td>${esc(l.t)}</td><td>${esc(l.f)}</td><td class="basis">${(l.law || []).filter(k => LAW[k]).map(k => esc(LAW[k].h)).join("<br>")}</td><td class="n">${fmt(l.a)}</td></tr>`);
  });
  const lawCell = l => (l.law || []).filter(k => LAW[k]).map(k => esc(LAW[k].h)).join("<br>");
  const measSum = allLines().reduce((a, x) => a + x.lines.reduce((p, q) => p + q.a, 0), 0);
  const rl = calcReg(); const regSum = rl.reduce((a, b) => a + b.a, 0);
  let regRows = "";
  const onlyReg = reg && !order.length;
  if (reg && !onlyReg) {
    rows += `<tr class="tot"><td colspan="3">測量費小計</td><td class="n">${fmt(measSum)}</td></tr>`;
  }
  if (reg) {
    regRows = `<h2 style="font-size:14pt;margin:5mm 0 2mm">登記規費</h2>
      <table><thead><tr><th style="width:34%">項目</th><th style="width:22%">算式</th><th>依據</th><th style="width:14%">金額（元）</th></tr></thead><tbody>
      ${rl.map(l => `<tr><td>${esc(l.t)}</td><td>${esc(l.f)}</td><td class="basis">${lawCell(l)}</td><td class="n">${fmt(l.a)}</td></tr>`).join("") || `<tr><td colspan="4">（無）</td></tr>`}
      <tr class="tot"><td colspan="3">登記規費小計</td><td class="n">${fmt(regSum)}</td></tr></tbody></table>`;
  }
  const flagged = allLines().some(x => x.lines.some(l => l.flag)) || rl.some(l => l.flag);
  document.getElementById("printArea").innerHTML = `<div class="rp">
    <h1>${onlyReg ? "登記規費收費明細" : reg ? "測量及登記規費收費明細" : "測量案件預收費用明細"}</h1>
    <div class="meta"><div>收件字號：${esc(c.no) || "＿＿＿＿＿＿＿＿"}</div><div>試算時間：${ds}</div>
      <div>申請人：${esc(c.who) || "＿＿＿＿＿＿＿＿"}</div><div>坐落：${esc(c.where) || "＿＿＿＿＿＿＿＿"}</div></div>
    ${onlyReg ? "" : `<h2 style="font-size:14pt;margin:0 0 2mm">${reg ? "測量費" : ""}</h2><table><thead><tr><th style="width:34%">項目</th><th style="width:22%">算式</th><th>依據</th><th style="width:14%">金額（元）</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="4">尚未選擇申請原因</td></tr>`}
    ${reg ? "" : `<tr class="tot"><td colspan="3">應預收合計　新臺幣 ${cnMoney(total)} 元整</td><td class="n">${fmt(total)}</td></tr>`}</tbody></table>`}
    ${regRows}
    ${reg ? `<table style="margin-top:4mm"><tbody><tr class="tot"><td>應收合計（${onlyReg ? "" : `測量費 ${fmt(measSum)}＋`}登記規費 ${fmt(regSum)}）　新臺幣 ${cnMoney(total)} 元整</td><td class="n" style="width:14%">${fmt(total)}</td></tr></tbody></table>` : ""}
    <div class="notes">
      ${flagged ? "<p>⚠ 本明細含尚未填好的項目（標 ⚠ 者），請確認後再收費。</p>" : ""}
      ${onlyReg ? `<p>一、登記規費依土地法第 65、67、73、76 條、《土地登記規費及其罰鍰計收補充規定》及書狀費、工本費及閱覽費收費標準計算。</p>` : `
      <p>一、本表為收件預收試算，線段數、點數、面積單位以實際測量結果為準，多退少補。</p>
      <p>二、依據《土地複丈費及建築改良物測量費收費標準》（112 年 5 月 1 日施行）及本所收件作法${reg ? "；登記規費依土地法第 65、67、73、76 條、《土地登記規費及其罰鍰計收補充規定》及書狀費、工本費及閱覽費收費標準" : ""}。</p>
      <p>三、複丈或測量日期前撤回者，依第 8 條扣除已支出費用（已赴現場整備 800 元；未赴現場 300 元）後退還。</p>`}
    </div>
    <div class="sign"><span>收件人員：＿＿＿＿＿＿＿＿</span><span>申請人確認：＿＿＿＿＿＿＿＿</span></div>
    <p class="brandline">本明細由「貓裡規費通」v${VERSION} 試算產生</p></div>`;
  let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (!framed) { window.print(); return; }
  document.getElementById("dlgTitle").textContent = "預收費用明細";
  document.getElementById("dlgBody").innerHTML = `
    <p class="warn" style="margin:0">這個畫面不能直接叫出印表機。請用瀏覽器直接打開 HTML 檔再按「🖨 列印明細」，或先按下面的「複製明細」貼到 Word 再印。</p>
    <div class="btns" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="btnCopy">📋 複製明細</button><span id="copyMsg" style="align-self:center;color:var(--muted);font-size:14px"></span></div>
    <div class="pv">${document.getElementById("printArea").innerHTML}</div>`;
  document.getElementById("btnCopy").onclick = () => {
    const txt = allLines().map(({ it, lines }) => `【${it.name}】\n` + lines.map(l => `  ${l.t}　${l.f}　${fmt(l.a)} 元`).join("\n")).join("\n") + (reg ? `\n【登記規費】\n` + calcReg().map(l => `  ${l.t}　${l.f}　${fmt(l.a)} 元`).join("\n") : "") + `\n應預收合計：${fmt(total)} 元（新臺幣${cnMoney(total)}元整）`;
    const msg = document.getElementById("copyMsg");
    navigator.clipboard.writeText(txt).then(() => msg.textContent = "已複製，可以貼到 Word 或 LINE。", () => { msg.textContent = "複製失敗，請直接選取下面的表格複製。"; });
  };
  dlg.showModal();
};

/* ---- 小提示 ---- */
let toastT = 0;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }

/* ---- 其他 ---- */
let resetArmed = 0;
document.getElementById("btnReset").onclick = () => {
  const b = document.getElementById("btnReset");
  if (Date.now() - resetArmed > 3000) { resetArmed = Date.now(); b.textContent = "⚠ 再按一次確定清空"; setTimeout(() => b.textContent = "🧹 清空重來", 3000); return; }
  resetArmed = 0; b.textContent = "🧹 清空重來";
  for (const k in state) delete state[k]; order = []; reg = null;
  caseNo.value = caseWho.value = caseWhere.value = "";
  renderTiles(); renderCards(); renderReg(); update();
  document.getElementById("q").value = ""; renderSearch();
  window.scrollTo({ top: 0, behavior: "smooth" });
  toast("已清空，可以收下一位了");
};
document.getElementById("btnTheme").onclick = () => {
  const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
[caseNo, caseWho, caseWhere].forEach(i => { i.oninput = () => update(); i.setAttribute("autocomplete", "off"); });
document.querySelectorAll("input, textarea").forEach(i => i.setAttribute("autocomplete", "off"));
// 關掉主畫面時，民眾畫面也一起關掉
window.addEventListener("pagehide", () => { try { if (custWin && !custWin.closed) custWin.close(); } catch (e) {} });

(function init() {
  caseNo.value = caseWho.value = caseWhere.value = "";   // 避免瀏覽器自動帶回上次填的字
  renderTiles(); renderCards(); renderReg(); update();
  document.getElementById("verTag").textContent = "v" + VERSION;
})();
document.getElementById("verTag").onclick = () => {
  document.getElementById("dlgTitle").textContent = "更新紀錄";
  document.getElementById("dlgBody").innerHTML = `<p style="margin:0;color:var(--muted);font-size:14px">目前版本 v${VERSION}。以後按標題旁邊的版本號，就能看到這裡。</p>` +
    CHANGES.map(c => `<div class="law"><h3>v${c.v}　${c.d}</h3>${c.items.map(i => `<p>・${esc(i)}</p>`).join("")}</div>`).join("");
  dlg.showModal();
};
</script>
</body>
</html>
